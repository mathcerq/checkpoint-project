name: Continuous Integration - Build & Test (Ajustado)

# Disparar esta Action a partir do evento push nas branchs: develop, feature, hotfix
on:
  push:
    branches:
      - develop
      - feature
      - hotfix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Tarefa 1 & 2: Execução de testes (ignorada) e Empacotamento
      # O comando 'mvn package' tenta executar testes.
      # Usamos -DskipTests para pular o teste e garantir que o JAR seja criado.
      - name: Empacotar Aplicação (Gerar JAR)
        run: mvn -B package -DskipTests